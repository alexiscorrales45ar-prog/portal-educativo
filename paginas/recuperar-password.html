<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #eef4f8,
                #dce8f0
            );
        }

        .recuperar-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .recuperar-box {
            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;

            object-fit: contain;

            margin-bottom: 15px;
        }

        h1 {
            color: #1d3557;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .descripcion {
            color: #666;
            font-size: 15px;
            line-height: 1.5;

            margin-bottom: 25px;
        }

        .campo {
            text-align: left;
            margin-bottom: 18px;
        }

        .campo label {
            display: block;

            font-weight: bold;

            color: #333;

            margin-bottom: 7px;
        }

        .campo input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: border-color 0.2s;
        }

        .campo input:focus {
            border-color: #1d6fa5;
        }

        .btn-recuperar {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1d6fa5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: background 0.2s;
        }

        .btn-recuperar:hover {
            background: #155579;
        }

        #mensaje {
            margin-top: 18px;

            font-size: 14px;

            line-height: 1.4;
        }

        .volver {
            display: inline-block;

            margin-top: 22px;

            color: #1d6fa5;

            text-decoration: none;

            font-size: 14px;
        }

        .volver:hover {
            text-decoration: underline;
        }

    </style>
</head>


<body>

    <div class="recuperar-container">

        <div class="recuperar-box">

            <img
                src="img/escudo.JPG"
                alt="Escudo institucional"
                class="logo"
            >

            <h1>Restablecer contraseña</h1>

            <p class="descripcion">
                Ingresa tu nueva contraseña para recuperar
                el acceso al panel administrativo.
            </p>


            <form id="form-recuperar">

                <div class="campo">

                    <label for="nueva-password">
                        Nueva contraseña
                    </label>

                    <input
                        type="password"
                        id="nueva-password"
                        placeholder="Ingresa tu nueva contraseña"
                        required
                        minlength="6"
                    >

                </div>


                <div class="campo">

                    <label for="confirmar-password">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar-password"
                        placeholder="Repite tu nueva contraseña"
                        required
                        minlength="6"
                    >

                </div>


                <button
                    type="submit"
                    class="btn-recuperar"
                >
                    Cambiar contraseña
                </button>

            </form>


            <p id="mensaje"></p>


            <a
                href="admin.html"
                class="volver"
            >
                ← Volver al acceso administrativo
            </a>

        </div>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Conexión de tu proyecto -->
    <script src="supabase.js"></script>


    <script>

        document
            .getElementById('form-recuperar')
            .addEventListener('submit', async function(event) {

                event.preventDefault();

                const nuevaPassword =
                    document.getElementById('nueva-password').value;

                const confirmarPassword =
                    document.getElementById('confirmar-password').value;

                const mensaje =
                    document.getElementById('mensaje');


                if (nuevaPassword !== confirmarPassword) {

                    mensaje.textContent =
                        'Las contraseñas no coinciden.';

                    return;
                }


                const { error } =
                    await supabaseClient.auth.updateUser({

                        password: nuevaPassword

                    });


                if (error) {

                    console.error(
                        '❌ Error al cambiar contraseña:',
                        error
                    );

                    mensaje.textContent =
                        'No se pudo cambiar la contraseña: ' +
                        error.message;

                    return;
                }


                mensaje.textContent =
                    '✅ Contraseña actualizada correctamente.';

            });

    </script>

</body>

</html>
